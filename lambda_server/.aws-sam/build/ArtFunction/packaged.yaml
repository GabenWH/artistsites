AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  ArtFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri:
        Bucket: test-art-795354128
        Key: ArtFunction.zip
      Handler: art.handler
      Runtime: nodejs18.x
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          IMAGE_BUCKET: test-image-art
          S3_ENDPOINT: https://s3.amazonaws.com
      Events:
        ArtAPI:
          Type: Api
          Properties:
            Path: /art
            Method: GET
            RestApiId:
              Ref: MyApi
    Metadata:
      SamResourceId: ArtFunction
  MyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: dev
      Cors: '''*'''
    Metadata:
      SamResourceId: MyApi
Globals:
  Function:
    Timeout: 10
    MemorySize: 128
